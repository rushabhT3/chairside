[project]
name = "chairside-agent"
version = "0.1.0"
description = "Chairside agent runtime: onboarding + consultation agents over MCP and REST adapters"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "google-adk==2.8.0",
  "mcp==2.1.1",
  "httpx==0.28.1",
  "pydantic==2.13.5",
]

[project.scripts]
chairside_agent = "chairside_agent.main:run"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chairside_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["chairside_agent/tests"]
