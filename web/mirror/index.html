<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F1EA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Mirror · Chairside</title>
    <meta
      name="description"
      content="Sit. Scan. See. One selfie at the chair: your readings, your look in the salon's own shades, honest prices, and consent you sign on your own phone."
    />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Geist:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Geist:wght@400;500;600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root">
      <div class="mirror">
        <header class="mirror-header">
          <p class="mirror-salon">Atelier Noor</p>
          <p class="mirror-step">Welcome</p>
        </header>
        <main class="mirror-body" id="main">
          <section class="welcome">
            <h1 class="welcome-salon">Atelier Noor</h1>
            <p class="welcome-line">Sit. Scan. See.</p>
            <button type="button" class="btn btn-primary welcome-cta">Start your scan</button>
            <p class="welcome-privacy">
              Your selfie is processed and deleted after rendering unless you keep it for progress
              tracking.
            </p>
            <label class="toggle" for="retention">
              <input id="retention" class="toggle-input" type="checkbox" role="switch" aria-checked="false" />
              <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
              <span class="toggle-label">Keep my scans for progress tracking</span>
            </label>
            <button type="button" class="btn btn-link">Delete everything now</button>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/mirror/main.tsx"></script>
  </body>
</html>
